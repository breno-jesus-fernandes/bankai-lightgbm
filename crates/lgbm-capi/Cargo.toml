[package]
name = "lgbm-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# cdylib/staticlib expose the `LGBM_*` symbols to C; rlib keeps the crate usable from the
# Rust integration tests (and other crates) without a C toolchain.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
lgbm-core.workspace = true

[dev-dependencies]
lgbm-core.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
