[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/breno-jesus-fernandes/bankai-lightgbm"
rust-version = "1.97"

[workspace.dependencies]
lgbm-core = { path = "crates/lgbm-core" }
lgbm-io = { path = "crates/lgbm-io" }
thiserror = "2"
rayon = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
