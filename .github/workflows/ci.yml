name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: scripts/miri.sh

  # Pull requests run the benchmark gate only when they touch hot-path code (AGENTS.md section 5).
  # Pushes to main and manual runs always benchmark.
  changes:
    runs-on: ubuntu-latest
    outputs:
      hot: ${{ steps.filter.outputs.hot }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            hot:
              - 'crates/lgbm-core/src/treelearner/**'
              - 'crates/lgbm-core/src/boosting/**'
              - 'crates/lgbm-core/src/objective/**'
              - 'crates/lgbm-core/src/io/bin.rs'
              - 'crates/lgbm-core/src/io/bin_data.rs'
              - 'crates/lgbm-core/src/io/sparse.rs'
              - 'crates/lgbm-core/src/io/sample.rs'
              - 'crates/lgbm-core/src/predictor.rs'
              - 'crates/lgbm-core/src/tree.rs'
              - 'crates/lgbm-core/src/utils/spin_pool.rs'
              - 'crates/lgbm-core/src/utils/common.rs'
              - 'crates/lgbm-core/benches/**'
              - 'scripts/bench_interleaved.py'
              - '.github/workflows/ci.yml'

  benchmark:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.hot == 'true'
    runs-on: ubuntu-latest
    env:
      # Intel code placement: where the linker puts a tight loop's branches changes its speed by
      # about 30% (partition/numerical/200k on the 2-vCPU runners). Keeping branches inside 32-byte
      # windows removes that swing. Base and candidate are both built with it, so the comparison
      # stays fair; the product build is unchanged.
      RUSTFLAGS: "-C llvm-args=-x86-branches-within-32B-boundaries"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Interleaved benchmark against the base revision (5% limit)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/bench_interleaved.py

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          # The LightGBM wheel on macOS links libomp from Homebrew; the runner does not ship it.
          if [ "$RUNNER_OS" = "macOS" ]; then brew install libomp; fi
          pip install -e ".[dev]"
      - name: Lint and test
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          ruff format --check python scripts tests
          ruff check python scripts tests
          mypy
          pytest
