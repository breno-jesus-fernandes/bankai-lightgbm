name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: scripts/miri.sh

  # Pull requests run the benchmark gate only when they touch hot-path code (AGENTS.md section 5).
  # Pushes to main and manual runs always benchmark.
  changes:
    runs-on: ubuntu-latest
    outputs:
      hot: ${{ steps.filter.outputs.hot }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            hot:
              - 'crates/lgbm-core/src/treelearner/**'
              - 'crates/lgbm-core/src/boosting/**'
              - 'crates/lgbm-core/src/objective/**'
              - 'crates/lgbm-core/src/io/bin.rs'
              - 'crates/lgbm-core/src/io/bin_data.rs'
              - 'crates/lgbm-core/src/io/sparse.rs'
              - 'crates/lgbm-core/src/io/sample.rs'
              - 'crates/lgbm-core/src/predictor.rs'
              - 'crates/lgbm-core/src/tree.rs'
              - 'crates/lgbm-core/src/utils/spin_pool.rs'
              - 'crates/lgbm-core/src/utils/common.rs'
              - 'crates/lgbm-core/benches/**'
              - 'scripts/bench_interleaved.py'
              - '.github/workflows/ci.yml'

  benchmark:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.hot == 'true'
    runs-on: ubuntu-latest
    env:
      # Code placement: where the linker puts a hot function changes its speed by up to 30%
      # (partition/numerical/200k on the 2-vCPU runners). Aligning every function to 64 bytes
      # makes placement deterministic. Base and candidate are both built with it, so the comparison
      # stays fair; the product build is unchanged. (The 32-byte branch-boundary flag used before
      # left a ~4% gap in local measurements and did not clear the CI gate.)
      #
      # codegen-units=1 removes the other half of the problem: with the default 16 units, adding
      # unrelated code to a crate re-partitions it and changes an untouched hot function's codegen
      # (e.g. wiring quantized training shifted quantization/nearest_* by ~7% on byte-identical
      # discretizer code). A single unit makes each crate's codegen a deterministic function of its
      # own source, so an unrelated change no longer moves a benchmark. Both revisions use it, so
      # the comparison stays fair; the product build is unchanged.
      RUSTFLAGS: "-C llvm-args=-align-all-functions=6 -C codegen-units=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Interleaved benchmark against the base revision (5% limit)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/bench_interleaved.py

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Compile a C program against the verbatim upstream header and link the lgbm-capi static library,
  # then run it end to end (ROADMAP T5.3 "Verify": a C test harness built against the upstream
  # header). `cc` is preinstalled on the runner.
  c_header_harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: scripts/c_header_harness.sh

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.97.1
      # Windows pull-request builds failed to link python3.lib with a restored cache (LNK1181);
      # build from scratch there. Other platforms keep the cache.
      - if: matrix.os != 'windows-latest'
        uses: Swatinem/rust-cache@v2
      - name: Install
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          # The LightGBM wheel on macOS links libomp from Homebrew; the runner does not ship it.
          if [ "$RUNNER_OS" = "macOS" ]; then brew install libomp; fi
          pip install -e ".[dev]"
      - name: Lint and test
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          ruff format --check python scripts tests
          ruff check python scripts tests
          mypy
          pytest
