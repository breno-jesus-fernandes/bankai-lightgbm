name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: scripts/miri.sh

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/bankai-baseline-target
        run: |
          git worktree add --detach "$RUNNER_TEMP/bankai-baseline" "$BASE_SHA"
          cargo bench --manifest-path "$RUNNER_TEMP/bankai-baseline/Cargo.toml" -p lgbm-core --bench kernels -- --save-baseline main --warm-up-time 1 --measurement-time 3 --sample-size 20
          mkdir -p "$GITHUB_WORKSPACE/target/criterion"
          cp -a "$CARGO_TARGET_DIR/criterion/." "$GITHUB_WORKSPACE/target/criterion/"
      - name: Benchmark this revision and enforce the 5% limit
        run: |
          cargo bench -p lgbm-core --bench kernels -- --save-baseline candidate --warm-up-time 1 --measurement-time 3 --sample-size 20
          python scripts/check_criterion_regression.py target/criterion candidate main

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pip install -e ".[dev]"
      - name: Lint and test
        shell: bash
        run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          ruff format --check python scripts tests
          ruff check python scripts tests
          mypy
          pytest
