name: Linux x86-64 no-missing-node prediction experiment

on:
  push:
    branches: [bench/v1-linux-x86-64]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install the candidate release build
        run: |
          git switch --detach 0ede2cc58bed634cb34c9155432c4bf4b09e53b6
          git rev-parse HEAD
          uname -sm
          test "$(uname -m)" = x86_64
          lscpu | sed -n '1,20p'
          rustc --version
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install maturin numpy scipy 'lightgbm==4.7.0' pytest
          maturin develop -r
          python -c 'import bankai_lightgbm, lightgbm; print(bankai_lightgbm.__version__, lightgbm.__version__)'
      - name: Build the no-missing experiment and test parity
        run: |
          source .venv/bin/activate
          cp python/bankai_lightgbm/_lib.abi3.so "$RUNNER_TEMP/base.so"
          python - <<'PY2'
          from pathlib import Path
          p = Path("crates/lgbm-core/src/tree.rs")
          src = p.read_text()
          at = src.index("        if fval.is_nan()", src.index("    fn numerical_decision("))
          src = src[:at] + """        if missing_type == MissingType::None {
                      let value = if fval.is_nan() { 0.0 } else { fval };
                      let go_left = value <= self.threshold[node];
                      return if go_left { self.left_child[node] } else { self.right_child[node] };
                  }
          """ + src[at:]
          p.write_text(src)
          PY2
          maturin develop -r
          cp python/bankai_lightgbm/_lib.abi3.so "$RUNNER_TEMP/zero.so"
          pytest -q tests/parity/test_sparse_predict_parity.py
      - name: Interleave baseline, no-missing experiment, and upstream
        run: |
          source .venv/bin/activate
          python - <<'PY2'
          import os
          import shutil
          import statistics
          import subprocess
          import sys
          from pathlib import Path
          tmp = Path(os.environ["RUNNER_TEMP"])
          extension = Path("python/bankai_lightgbm/_lib.abi3.so")
          worker = r"""
          import sys, time
          sys.path.insert(0, 'benches')
          from bench_train_interleaved import bk, lightgbm, np, CASES
          kind = sys.argv[1]
          mod = lightgbm if kind == 'upstream' else bk
          data = {key: make(np.random.default_rng(0)) for key,make in CASES.items()}
          p = dict(objective='regression',num_threads=1,verbose=-1)
          models = {
              key:mod.Booster(model_str=lightgbm.train(p,lightgbm.Dataset(x,y,params=p),num_boost_round=50).model_to_string())
              for key,(x,y) in data.items()
          }
          print('ready',flush=True)
          for inp in sys.stdin:
              key,nthreads,kind=inp.split()
              x,_=data[key]
              kwargs=dict(num_threads=int(nthreads),pred_leaf=kind=='leaf',raw_score=kind=='score')
              start=time.perf_counter()
              pred=models[key].predict(x,**kwargs)
              elapsed=time.perf_counter()-start
              print(elapsed, pred.size, float(pred.sum()),flush=True)
          """
          processes = {}
          try:
              for kind in ('base','zero','upstream'):
                  if kind != 'upstream':
                      swap=extension.with_suffix('.swap')
                      shutil.copyfile(tmp/f'{kind}.so',swap)
                      swap.replace(extension)
                  p=subprocess.Popen([sys.executable,'-c',worker,kind],stdin=subprocess.PIPE,stdout=subprocess.PIPE,text=True)
                  processes[kind]=p
                  assert p.stdout.readline().strip()=='ready'
              for case in ('sparse','dense'):
                  for threads in (1,2):
                      for mode in ('score','leaf'):
                          ts={k:[] for k in processes}
                          for i in range(10):
                              fingerprints={}
                              for k in (processes if i%2==0 else reversed(processes)):
                                  p=processes[k]
                                  p.stdin.write(f'{case} {threads} {mode}\n')
                                  p.stdin.flush()
                                  elapsed,n,total=p.stdout.readline().split()
                                  fingerprints[k]=(n,total)
                                  if i:
                                      ts[k].append(float(elapsed))
                              assert fingerprints['base']==fingerprints['zero'],fingerprints
                          meds={k:statistics.median(v)*1000 for k,v in ts.items()}
                          print(f'{case} threads={threads} {mode}: {meds} candidate/base={meds["zero"]/meds["base"]:.3f}',flush=True)
          finally:
              for p in processes.values():
                  p.stdin.close()
                  p.wait()
          PY2
