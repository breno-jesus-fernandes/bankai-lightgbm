name: Linux x86-64 prediction investigation

on:
  push:
    branches: [bench/v1-linux-x86-64]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_WAIT_POLICY: PASSIVE
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install the candidate release build
        run: |
          git switch --detach 0ede2cc58bed634cb34c9155432c4bf4b09e53b6
          git rev-parse HEAD
          uname -sm
          test "$(uname -m)" = x86_64
          lscpu | sed -n '1,20p'
          rustc --version
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install maturin numpy scipy 'lightgbm==4.7.0' py-spy
          CARGO_PROFILE_RELEASE_DEBUG=1 maturin develop -r
          python -c 'import bankai_lightgbm, lightgbm; print(bankai_lightgbm.__version__, lightgbm.__version__)'
      - name: Compare prediction costs by input and tree count
        run: |
          source .venv/bin/activate
          cat > "$RUNNER_TEMP/csr-profile.py" <<'PY2'
          import sys
          import statistics
          import time
          from pathlib import Path

          sys.path.insert(0, "benches")
          from bench_train_interleaved import bk, lightgbm, np, _sparse

          x, y = _sparse(np.random.default_rng(0))
          dense = x.toarray()
          model_path = Path(".prediction-investigation.txt")
          if len(sys.argv) > 1:
              mod = bk if sys.argv[1] == "bankai" else lightgbm
              model = mod.Booster(model_file=str(model_path))
              end = time.monotonic() + 12
              while time.monotonic() < end:
                  model.predict(x, raw_score=True, num_threads=1)
              sys.exit()
          upstream = lightgbm.train(
              dict(objective="regression", num_threads=1, verbose=-1),
              lightgbm.Dataset(x, y, params=dict(num_threads=1, verbose=-1)),
              num_boost_round=50,
          )
          upstream.save_model(str(model_path))
          bankai = bk.Booster(model_file=str(model_path))
          for name, data in (("dense", dense), ("csr", x)):
              for trees in (1, 5, 25, 50):
                  for leaf in (False, True):
                      kwargs = dict(num_iteration=trees, raw_score=not leaf, pred_leaf=leaf, num_threads=1)
                      models = bankai, upstream
                      expected = upstream.predict(data, **kwargs)
                      actual = bankai.predict(data, **kwargs)
                      np.testing.assert_allclose(actual, expected, rtol=1e-12, atol=1e-14)
                      times = [[], []]
                      for r in range(9):
                          for i in ((0, 1) if r % 2 == 0 else (1, 0)):
                              start = time.perf_counter()
                              models[i].predict(data, **kwargs)
                              times[i].append(time.perf_counter() - start)
                      a, b = map(statistics.median, times)
                      print(f"{name} trees={trees} leaf={leaf}: Bankai={a*1e3:.3f} ms upstream={b*1e3:.3f} ms ratio={a/b:.3f}", flush=True)
          PY2
          python "$RUNNER_TEMP/csr-profile.py"
      - name: Collect native CPU samples for both CSR predictors
        run: |
          for library in bankai upstream; do
            echo "profile: $library"
            if command -v perf >/dev/null && sudo -n perf record -o "$RUNNER_TEMP/$library.perf" -e cpu-clock:u -F 499 -- .venv/bin/python "$RUNNER_TEMP/csr-profile.py" "$library"; then
              sudo -n perf report -i "$RUNNER_TEMP/$library.perf" --stdio --sort dso,symbol --percent-limit 1
            else
              sudo -n env OMP_WAIT_POLICY=PASSIVE "$PWD/.venv/bin/py-spy" record --native --rate 399 --format raw --output "$RUNNER_TEMP/$library.profile" -- "$PWD/.venv/bin/python" "$RUNNER_TEMP/csr-profile.py" "$library"
              sudo -n sort -t ' ' -k2,2nr "$RUNNER_TEMP/$library.profile" | head -18
            fi
          done
